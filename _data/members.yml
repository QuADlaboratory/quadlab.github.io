- name: Effie Pereira
  pronouns: she/her
  position: Primary Investigator
  image: '/images/effie-pereira.png'
  bio: Effie is an Assistant Professor in the Department of Psychology and Director of the QuAD Lab. Before this, she completed her Banting Postdoctoral Fellowship at the University of Waterloo & her PhD at McGill University.

- name: Dr. Allison Drody
  pronouns: she/her
  position: Postdoctoral Fellow
  image: '/images/allison-drody.png'
  bio: Allison completed her PhD in Psychology (Cognitive Neuroscience) at the University of Waterloo. She is interested in how and why the focus of our attention changes over time, particularly in media-rich environments where opportunities for distraction are abundant.


- name: Emily Allan
  pronouns: she/her
  position: Lab Coordinator 
  image: '/images/emily-allan.png'
  bio: Emily is a fifth-year Psychology major with a minor in English Literature at Queen's University. She is excited to build her skills in cognitive research and develop hands-on lab experience. She aspires to have a career in cognitive research. 


- name: Aahana Uppal
  pronouns: she/her
  position: Graduate Student
  image: '/images/aahana-uppal.png' 
  bio: Aahana is a Master’s student in the Cognitive Neuroscience program at Queen’s University. She completed her Bachelor of Cognitive Science (Honours) degree at Carleton University in 2025.  She is excited to learn more about individual differences in attention and to incorporate eye-tracking and neuroimaging measures in her research.


- name: Mridula Srikanth
  pronouns: she/her
  position: Graduate Student
  image: '/images/mridula-srikanth.png' 
  bio: Mridula is a Master’s student in the Cognitive Neuroscience program at Queen’s University. She completed her Bachelor of Arts (Honours) degree in Psychology at Queen’s University in 2025. She is excited to learn more about attention and social cognition and to explore new directions and broaden her research horizons.


- name: Evren Bradley
  pronouns: they/them
  position: Programmer
  image: '/images/evren-bradley.png'
  bio: Evren is a third-year Mechatronics Engineering student at Queen's University. They are excited to learn about dynamic attention develop a research platform for the QUAD lab!


- name: Ella Gronlund
  pronouns: she/her
